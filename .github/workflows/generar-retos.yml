name: Generar retos

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/generate.mjs --days 30
      - run: node scripts/validate.mjs
      - name: Subir los retos nuevos
        run: |
          git config user.name "generador-de-retos"
          git config user.email "generador@users.noreply.github.com"
          git add public/days
          if git diff --cached --quiet; then
            echo "No hay retos nuevos."
          else
            git commit -m "Retos nuevos"
            git push
          fi
